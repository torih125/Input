<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="title">
        <h1>Dress Your Unicorn!</h1>
    </div>

    <div id="bg">
        <div id="unicorn">
            <img src="assets/unicorn.png">
        </div>

        <div id="partyhat">
            <img src="assets/partyhat.png">
        </div>

        <div id="necklace">
            <img src="assets/necklace.png">
        </div>

        <div id="tutu">
            <img src="assets/tutu.png">
        </div>

        <div id="wand">
            <img src="assets/wand1.png">
        </div>
    </div>

<div id="controls">
    <p>
        <label for="party-hat-x">party hat x</label>
        <input id="party-hat-x" type="range" min="0" max="1000" value="200" />
        <label for="party-hat-y">party hat y</label>
        <input id="party-hat-y" type="range" min="-100" max="800" value="200" />
    </p>

    <p>
        <label for="necklace-x">necklace x</label>
        <input id="necklace-x" type="range" min="0" max="1000" value="200" />
        <label for="necklace-y">necklace y</label>
        <input id="necklace-y" type="range" min="-100" max="600" value="200" />
    </p>

    <p>
        <label for="tutu-x">tutu x</label>
        <input id="tutu-x" type="range" min="0" max="1000" value="200" />
        <label for="tutu-y">tutu y</label>
        <input id="tutu-y" type="range" min="-100" max="600" value="200" />
    </p>

    <p>
        <label for="wand-x">wand x</label>
        <input id="wand-x" type="range" min="0" max="1000" value="200" />
        <label for="wand-y">wand y</label>
        <input id="wand-y" type="range" min="-100" max="600" value="200" />
    </p>
</div>

    <script src="script.js"></script>
</body>
</html>
